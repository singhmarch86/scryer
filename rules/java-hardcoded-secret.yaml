rules:
  - id: scryer.java.hardcoded-secret
    languages: [java]
    severity: WARNING
    message: >-
      Detected a hardcoded value in a field whose name suggests it holds a
      credential (password/secret/token/apikey). Hardcoded credentials in
      source code end up in version control history and compiled
      artifacts. Load this from environment variables, a secrets manager,
      or externalized config instead. Semgrep's free registry did not
      flag this exact pattern during Scryer's own testing.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      references:
        - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
    patterns:
      - pattern-either:
          - pattern: $TYPE $NAME = "$VALUE";
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(password|secret|token|apikey|api_key|credential).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: .{4,}
